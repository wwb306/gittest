<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="快乐单词闯关">
<meta name="theme-color" content="#ff9f43">
<title>快乐单词闯关</title>
<style>
:root{--bg:#fff8e9;--card:#fff;--ink:#273643;--muted:#70808b;--orange:#ff9f43;--yellow:#ffd65c;--green:#65c88d;--blue:#79baff;--pink:#ff98b9;--red:#d95454;--shadow:0 12px 34px rgba(45,60,70,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}body{background:radial-gradient(circle at 8% 8%,rgba(255,214,92,.32),transparent 24%),radial-gradient(circle at 92% 13%,rgba(121,186,255,.24),transparent 22%),radial-gradient(circle at 88% 88%,rgba(255,152,185,.2),transparent 22%),var(--bg)}button,input,textarea{font:inherit}.wrap{max-width:820px;margin:auto;padding:12px 12px calc(92px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:10;padding-top:max(7px,env(safe-area-inset-top));background:linear-gradient(rgba(255,248,233,.96),rgba(255,248,233,.88),transparent)}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px;background:rgba(255,255,255,.88);border-radius:22px;box-shadow:var(--shadow)}.brand{display:flex;gap:10px;align-items:center}.fox{width:50px;height:50px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(145deg,var(--yellow),var(--orange));font-size:29px}.title{font-size:20px;font-weight:900}.sub{font-size:12px;color:var(--muted);margin-top:3px}.headBtns{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.mini{border:0;border-radius:999px;background:#f1f4f5;padding:9px 11px;font-size:13px;font-weight:800}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:12px;margin-top:12px}.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.04)}.hero h2{margin:0 0 7px;font-size:25px}.hero p{margin:0;color:var(--muted);line-height:1.65}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chip{font-size:12px;font-weight:900;padding:7px 9px;border-radius:13px}.c1{background:#fff0b7}.c2{background:#e4f2ff}.c3{background:#e5f7eb}.statrow{display:flex;justify-content:space-between;align-items:flex-end}.big{font-size:34px;font-weight:900}.muted{color:var(--muted)}.barbg{height:15px;background:#edf1f3;border-radius:999px;overflow:hidden;margin-top:13px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--orange));transition:.25s}.stage{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 2px 9px}.tag{background:#f2f5f6;border-radius:999px;padding:8px 12px;font-weight:900}.question{min-height:405px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative}.question:before,.question:after{content:"";position:absolute;border-radius:50%;opacity:.16}.question:before{width:145px;height:145px;background:var(--blue);left:-55px;top:-50px}.question:after{width:150px;height:150px;background:var(--pink);right:-60px;bottom:-65px}.qindex{font-size:13px;color:var(--muted);font-weight:800;margin-bottom:17px}.cn{font-size:23px;font-weight:900;line-height:1.45;margin-bottom:18px}.pattern{max-width:100%;display:flex;gap:7px 9px;flex-wrap:wrap;justify-content:center;background:#fff9df;border:2px dashed #edc95c;border-radius:18px;padding:14px 15px}.word{display:inline-flex;align-items:flex-end;gap:3px}.letter,.punc{font-size:25px;font-weight:900;min-width:14px}.blank{width:37px;height:43px;border:2px solid #efca59;border-radius:11px;text-align:center;font-size:23px;font-weight:900;outline:none;background:#fff}.blank:focus,.full:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(121,186,255,.17)}.full{display:none;width:min(100%,650px);min-height:58px;border:3px solid #e6ebee;border-radius:18px;padding:13px 15px;text-align:center;font-size:19px;outline:none}.hint{min-height:38px;margin-top:10px;color:#7a5a00;font-weight:800}.feedback{min-height:32px;font-size:18px;font-weight:900;margin-top:8px}.ok{color:#238653}.bad{color:var(--red)}.actions{position:sticky;z-index:9;bottom:calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.btn{border:0;border-radius:17px;min-height:52px;padding:12px;font-weight:900;font-size:16px;box-shadow:0 5px 0 rgba(0,0,0,.07)}.btn:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(0,0,0,.06)}.green{background:var(--green)}.blue{background:#e6f2ff}.yellow{background:#fff0b5}.gray{background:#f1f3f4}.summary{display:none;text-align:center}.emoji{font-size:62px}.summary h2{font-size:28px;margin:8px 0}.wrongs{display:grid;gap:9px;margin-top:16px;text-align:left}.wrong{background:#fffaf0;border:1px solid #eee3d2;border-radius:15px;padding:11px}.wrong b{display:block}.small{font-size:13px;color:var(--muted);margin-top:3px}.install{margin-top:12px;background:#fffdf2;border:1px dashed #edc95c;border-radius:14px;padding:10px;font-size:13px;color:var(--muted);line-height:1.55}.mask{display:none;position:fixed;inset:0;background:rgba(30,40,48,.35);z-index:30;align-items:flex-end}.sheet{width:100%;max-width:820px;margin:auto;background:#fff;border-radius:26px 26px 0 0;padding:18px 15px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.sheet h3{margin:0 0 6px;font-size:23px}.sheet p{margin:0;color:var(--muted);line-height:1.55;font-size:14px}.editor{width:100%;min-height:260px;margin-top:11px;border:2px solid #e6ebee;border-radius:15px;padding:11px;line-height:1.55;outline:none}.sheetBtns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.sheetBtns .wide{grid-column:1/-1}.toast{position:fixed;left:50%;bottom:calc(95px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#273643;color:#fff;border-radius:999px;padding:9px 13px;opacity:0;transition:.2s;z-index:40;white-space:nowrap}.toast.show{opacity:1}.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}.confetti i{position:absolute;top:-22px;font-style:normal;animation:fall 1.7s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(650deg);opacity:.9}}@media(max-width:700px){.hero{grid-template-columns:1fr}.head{align-items:flex-start}.title{font-size:19px}.fox{width:46px;height:46px}.hero h2{font-size:23px}.question{min-height:410px}.cn{font-size:21px}.letter,.punc{font-size:22px}.blank{width:34px;height:41px;font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="head"><div class="brand"><div class="fox">🦊</div><div><div class="title">快乐单词闯关</div><div class="sub">U1 · A new start · iPhone 版</div></div></div><div class="headBtns"><button class="mini" id="edit">✏️ 家长编辑</button><button class="mini" id="reset">🔄 重来</button></div></div></div>
  <div class="hero"><div class="card"><h2>今天也来赢一颗星吧！</h2><p>第 1 轮只补缺失字母；第 2 轮开始只给中文、完整拼写英文。答错的内容会自动进入下一轮，直到全部答对。</p><div class="chips"><span class="chip c1">① 缺字母填空</span><span class="chip c2">② 错题再挑战</span><span class="chip c3">③ 全对通关</span></div><div class="install">在 Safari 打开后点 <b>分享 → 添加到主屏幕</b>，以后可以像小 App 一样直接使用。</div></div><div class="card"><div class="statrow"><div><div class="muted">当前进度</div><div class="big"><span id="done">0</span>/<span id="total">0</span></div></div><div style="text-align:right"><div class="muted">本轮答对</div><div style="font-size:23px;font-weight:900">⭐ <span id="right">0</span></div></div></div><div class="barbg"><div class="bar" id="bar"></div></div></div></div>
  <div class="stage"><div class="tag" id="round">🎈 第 1 轮</div><div class="muted" id="mode">补空模式</div></div>
  <section class="card question" id="question"><div class="qindex" id="qindex"></div><div class="cn" id="cn"></div><div class="pattern" id="pattern"></div><input class="full" id="full" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="看中文，输入完整英文…"><div class="hint" id="hint"></div><div class="feedback" id="feedback"></div></section>
  <div class="actions" id="actions"><button class="btn blue" id="speak">🔊 听发音</button><button class="btn yellow" id="help">💡 提示</button><button class="btn gray" id="skip">🙈 我不会</button><button class="btn green" id="check">✅ 检查答案</button></div>
  <section class="card summary" id="summary"><div class="emoji" id="emoji">🌈</div><h2 id="sumTitle"></h2><div class="muted" id="sumText"></div><div class="wrongs" id="wrongs"></div><div class="actions" style="position:static;grid-template-columns:1fr;margin-top:18px"><button class="btn green" id="next">🚀 开始下一轮</button></div></section>
</div>
<div class="mask" id="mask"><div class="sheet"><h3>✏️ 家长编辑词库</h3><p>每行一条，格式：<b>英文 | 中文</b>。保存后会从第 1 轮重新开始。</p><textarea class="editor" id="editor"></textarea><div class="sheetBtns"><button class="btn gray" id="cancel">取消</button><button class="btn yellow" id="restore">恢复默认</button><button class="btn green wide" id="save">保存词库</button></div></div></div>
<div class="toast" id="toast"></div><div class="confetti" id="confetti"></div>
<script>
const DEFAULT=[
 {en:'school',cn:'学校'},{en:'friend',cn:'朋友'},{en:'classmate',cn:'同班同学'},{en:'teacher',cn:'教师；老师'},{en:'book',cn:'书本'},
 {en:'play sports',cn:'参加体育运动'},{en:'read new books',cn:'阅读新书'},{en:'study hard',cn:'努力学习'},
 {en:"What's your goal?",cn:'你的目标是什么？'},{en:'I want to be a good football player.',cn:'我想成为一名优秀的足球运动员。'},
 {en:'I can make a plan and follow it.',cn:'我能制定计划并执行它。'},{en:'Come on! You can do it.',cn:'加油！你能做到。'}
];
const $=s=>document.querySelector(s),E={done:$('#done'),total:$('#total'),right:$('#right'),bar:$('#bar'),round:$('#round'),mode:$('#mode'),qindex:$('#qindex'),cn:$('#cn'),pattern:$('#pattern'),full:$('#full'),hint:$('#hint'),feedback:$('#feedback'),question:$('#question'),actions:$('#actions'),summary:$('#summary'),emoji:$('#emoji'),sumTitle:$('#sumTitle'),sumText:$('#sumText'),wrongs:$('#wrongs'),next:$('#next'),edit:$('#edit'),reset:$('#reset'),speak:$('#speak'),help:$('#help'),skip:$('#skip'),check:$('#check'),mask:$('#mask'),editor:$('#editor'),cancel:$('#cancel'),restore:$('#restore'),save:$('#save'),toast:$('#toast'),confetti:$('#confetti')};
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let words=(()=>{try{return JSON.parse(store.get('kidWords3'))||DEFAULT}catch(e){return DEFAULT}})(),state,maskObj=[];
function norm(s){return(s||'').toLowerCase().replace(/[“”]/g,'"').replace(/[’‘]/g,"'").replace(/[?.!,，。！？;；:：]/g,'').replace(/\s+/g,' ').trim()}
function esc(s){return(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t){E.toast.textContent=t;E.toast.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>E.toast.classList.remove('show'),1500)}
function burst(n=14){let a=['⭐','✨','🌟','🎉'];for(let i=0;i<n;i++){let x=document.createElement('i');x.textContent=a[Math.floor(Math.random()*a.length)];x.style.left=(7+Math.random()*86)+'vw';x.style.fontSize=(16+Math.random()*16)+'px';x.style.animationDelay=(Math.random()*.2)+'s';E.confetti.appendChild(x);setTimeout(()=>x.remove(),2000)}}
function fresh(){return{round:1,queue:words.map((_,i)=>i),pos:0,right:0,wrong:[]}}
function saveState(){store.set('kidState3',JSON.stringify(state))}
function loadState(){try{let x=JSON.parse(store.get('kidState3'));if(x&&Array.isArray(x.queue)&&x.queue.every(i=>words[i]))return x}catch(e){}return null}
function item(){return words[state.queue[state.pos]]}
function makeMask(text){let ts=text.match(/[A-Za-z']+|[^A-Za-z']+/g)||[text],out=[];ts.forEach((t,ti)=>{if(!/[A-Za-z]/.test(t)){out.push({sep:t});return}let p=[...t].map((c,i)=>({c,hide:/[A-Za-z]/.test(c)&&i>0&&(((i+ti)%2===1)||(t.length>6&&i%4===0))}));if(!p.some(x=>x.hide)&&p.length>2)p[p.length-1].hide=true;out.push({parts:p})});return out}
function blankInput(e){e.target.value=(e.target.value||'').replace(/[^A-Za-z']/g,'').slice(0,1);if(e.target.value){let a=[...E.pattern.querySelectorAll('.blank')],i=a.indexOf(e.target);if(a[i+1])a[i+1].focus()}}
function blankKey(e){let a=[...E.pattern.querySelectorAll('.blank')],i=a.indexOf(e.target);if(e.key==='Backspace'&&!e.target.value&&a[i-1])a[i-1].focus();if(e.key==='Enter')submit(false)}
function drawMask(){E.pattern.innerHTML='';maskObj.forEach(t=>{if(t.sep!==undefined){let s=document.createElement('span');s.className='punc';s.textContent=t.sep;E.pattern.appendChild(s);return}let w=document.createElement('span');w.className='word';t.parts.forEach(p=>{if(!p.hide){let s=document.createElement('span');s.className='letter';s.textContent=p.c;w.appendChild(s)}else{let i=document.createElement('input');i.className='blank';i.maxLength=1;i.dataset.a=p.c;i.autocomplete='off';i.autocapitalize='off';i.spellcheck=false;i.addEventListener('input',blankInput);i.addEventListener('keydown',blankKey);w.appendChild(i)}});E.pattern.appendChild(w)});let f=E.pattern.querySelector('.blank');if(f)setTimeout(()=>f.focus(),80)}
function render(){E.summary.style.display='none';E.question.style.display='flex';E.actions.style.display='grid';let x=item(),fill=state.round===1;E.round.textContent='🎈 第 '+state.round+' 轮';E.mode.textContent=fill?'补空模式':'完整拼写';E.qindex.textContent='第 '+(state.pos+1)+' 题 / 共 '+state.queue.length+' 题';E.cn.textContent=x.cn;E.hint.textContent='';E.feedback.textContent='';E.done.textContent=state.pos;E.total.textContent=state.queue.length;E.right.textContent=state.right;E.bar.style.width=(state.pos/state.queue.length*100)+'%';if(fill){E.pattern.style.display='flex';E.full.style.display='none';maskObj=makeMask(x.en);drawMask()}else{E.pattern.style.display='none';E.full.style.display='block';E.full.value='';setTimeout(()=>E.full.focus(),80)}saveState()}
function fillAnswer(){let blanks=[...E.pattern.querySelectorAll('.blank')],bi=0,s='';maskObj.forEach(t=>{if(t.sep!==undefined)s+=t.sep;else t.parts.forEach(p=>s+=p.hide?(blanks[bi++]?.value||''):p.c)});return s}
function isRight(){return norm(state.round===1?fillAnswer():E.full.value)===norm(item().en)}
function submit(force){let ok=!force&&isRight(),idx=state.queue[state.pos];if(ok){state.right++;E.feedback.textContent='太棒啦，答对了！ ⭐';E.feedback.className='feedback ok';burst()}else{if(!state.wrong.includes(idx))state.wrong.push(idx);E.feedback.innerHTML='再记一下：<span style="color:#355a73">'+esc(item().en)+'</span>';E.feedback.className='feedback bad'}saveState();setTimeout(()=>{state.pos++;state.pos>=state.queue.length?finish():render()},ok?650:1250)}
function finish(){E.question.style.display='none';E.actions.style.display='none';E.summary.style.display='block';E.done.textContent=state.queue.length;E.total.textContent=state.queue.length;E.right.textContent=state.right;E.bar.style.width='100%';if(!state.wrong.length){E.emoji.textContent='🏆';E.sumTitle.textContent='全部通关啦！';E.sumText.textContent='第 '+state.round+' 轮全部答对，今天的星星拿满啦！';E.wrongs.innerHTML='';E.next.textContent='🌈 再玩一遍';burst(24)}else{E.emoji.textContent='🧠';E.sumTitle.textContent='这一轮完成啦！';E.sumText.textContent='答对 '+state.right+' 题，还有 '+state.wrong.length+' 个需要再练。下一轮只练这些错题。';E.wrongs.innerHTML=state.wrong.map(i=>'<div class="wrong"><b>'+esc(words[i].en)+'</b><div class="small">'+esc(words[i].cn)+'</div></div>').join('');E.next.textContent='🚀 开始第 '+(state.round+1)+' 轮'}saveState()}
function nextRound(){if(!state.wrong.length){state=fresh();render();return}state={round:state.round+1,queue:[...state.wrong],pos:0,right:0,wrong:[]};render()}
function hint(){let x=item().en.split(/\s+/).map(w=>{let m=w.match(/[A-Za-z']+/),a=m?m[0]:'';return a?a[0]+'…（'+a.length+'）':w});E.hint.textContent='小提示：'+x.join('  ')}
function speak(){if(!('speechSynthesis'in window)){toast('当前浏览器不支持发音');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(item().en);u.lang='en-US';u.rate=.82;u.pitch=1.03;speechSynthesis.speak(u)}
function openEdit(){E.editor.value=words.map(x=>x.en+' | '+x.cn).join('\n');E.mask.style.display='flex'}
function closeEdit(){E.mask.style.display='none'}
function saveEdit(){let a=E.editor.value.split(/\n+/).map(l=>{let p=l.split('|');if(p.length<2)return null;let en=p.shift().trim(),cn=p.join('|').trim();return en&&cn?{en,cn}:null}).filter(Boolean);if(!a.length){toast('至少保留 1 条');return}words=a;store.set('kidWords3',JSON.stringify(words));closeEdit();state=fresh();render();toast('词库已保存')}
E.check.onclick=()=>submit(false);E.skip.onclick=()=>submit(true);E.help.onclick=hint;E.speak.onclick=speak;E.next.onclick=nextRound;E.edit.onclick=openEdit;E.cancel.onclick=closeEdit;E.restore.onclick=()=>E.editor.value=DEFAULT.map(x=>x.en+' | '+x.cn).join('\n');E.save.onclick=saveEdit;E.reset.onclick=()=>{if(confirm('要从第 1 轮重新开始吗？')){state=fresh();render()}};E.full.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit(false)}});E.mask.addEventListener('click',e=>{if(e.target===E.mask)closeEdit()});state=loadState()||fresh();state.pos>=state.queue.length?finish():render();
</script>
</body>
</html>
